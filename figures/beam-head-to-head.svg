<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="'Noto Sans', 'Liberation Sans', system-ui, sans-serif">
<title id="t">OpenCrawl and the reference memory system on the BEAM benchmark, by conversation length</title>
<desc id="d">Paired horizontal bars of BEAM scores out of 100 under the benchmark's own answer prompt. 100K tokens: OpenCrawl 63.05, reference 60.05, lead +3.00 (95% interval +0.36 to +5.64). 500K tokens: OpenCrawl 61.59, reference 60.44, lead +1.15 (95% interval -0.41 to +2.71). 1M tokens: OpenCrawl 62.33, reference 58.98, lead +3.36 (95% interval +1.38 to +5.33). 10M tokens: OpenCrawl 51.88, reference 47.02, lead +4.86 (95% interval -0.72 to +10.44). All lengths: OpenCrawl 61.17, reference 58.51, lead +2.66 (95% interval +1.55 to +3.78).</desc>
