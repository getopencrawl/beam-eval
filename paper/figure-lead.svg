<text class="t3" x="465.3" y="422" font-size="11" text-anchor="middle" style="font-variant-numeric:tabular-nums">+4</text>
<line class="grid" x1="544.1" x2="544.1" y1="94" y2="404" stroke-width="1"/>
<text class="t3" x="544.1" y="422" font-size="11" text-anchor="middle" style="font-variant-numeric:tabular-nums">+6</text>
