<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="fig-title">OpenCrawl's lead over the reference evidence on BEAM, by conversation length and answer prompt</title>
<desc id="fig-desc">Dot and interval chart. For each conversation length and for all splits together, the lead of OpenCrawl over the reference system's evidence in points, with its 95% interval, under BEAM's own prompt and under the annotation-aided prompt. Under BEAM's own prompt the interval lies wholly above zero at 100K, 1M and for all splits together; under the annotation-aided prompt the interval lies wholly above zero at 1M and for all splits together.</desc>
<style>.surface{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#898781} .grid{stroke:#e1e0d9} .axis{stroke:#c3c2b7} .s1{stroke:#2a78d6;fill:#2a78d6} .s2{stroke:#eb6834;fill:#eb6834} .ring{stroke:#fcfcfb} @media (prefers-color-scheme: dark){.surface{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#898781} .grid{stroke:#2c2c2a} .axis{stroke:#383835} .s1{stroke:#3987e5;fill:#3987e5} .s2{stroke:#d95926;fill:#d95926} .ring{stroke:#1a1a19}}</style>
<rect class="surface" width="860" height="460"/>
<text class="t1" x="24" y="30" font-size="15" font-weight="600">OpenCrawl's lead over the reference evidence, in points</text>
<text class="t2" x="24" y="50" font-size="12">Same answer model and judge for both systems; dot = mean lead, line = 95% t interval over conversations</text>
<line class="s1" x1="24" x2="50" y1="74" y2="74" stroke-width="2" stroke-linecap="round"/><circle class="s1" cx="37" cy="74" r="4.5" stroke="none"/><text class="t2" x="58" y="78" font-size="12">BEAM&#x27;s own prompt (no annotations)</text>
<line class="s2" x1="324.0" x2="350.0" y1="74" y2="74" stroke-width="2" stroke-linecap="round"/><circle class="s2" cx="337.0" cy="74" r="4.5" stroke="none"/><text class="t2" x="358.0" y="78" font-size="12">Annotation-aided prompt</text>
<line class="grid" x1="150.0" x2="150.0" y1="94" y2="404" stroke-width="1"/>
<text class="t3" x="150.0" y="422" font-size="11" text-anchor="middle" style="font-variant-numeric:tabular-nums">−4</text>
<line class="grid" x1="228.8" x2="228.8" y1="94" y2="404" stroke-width="1"/>
<text class="t3" x="228.8" y="422" font-size="11" text-anchor="middle" style="font-variant-numeric:tabular-nums">−2</text>
